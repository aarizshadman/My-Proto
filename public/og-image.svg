<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181816"/>
      <stop offset="100%" stop-color="#0f0f0e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b85028"/>
      <stop offset="100%" stop-color="#e07446"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="rgba(242, 242, 238, 0.1)" stroke-width="2"/>

  <!-- Monogram Box -->
  <rect x="100" y="100" width="64" height="64" rx="12" fill="#fbfbf9"/>
  <text x="132" y="145" font-family="Georgia, serif" font-size="36" font-style="italic" font-weight="bold" fill="#181816" text-anchor="middle">A</text>

  <!-- Title & Subtitle -->
  <text x="100" y="240" font-family="'Times New Roman', Georgia, serif" font-size="64" font-weight="500" fill="#f2f2ee" letter-spacing="-1">Aariz Shadman</text>
  <text x="100" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="url(#accent)">Student, Builder &amp; Explorer</text>

  <!-- Description -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#a8a8a0">Exploring software systems, storage engines, compilers,</text>
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#a8a8a0">and thoughtful, low-latency tools for curious minds.</text>

  <!-- Bottom Details -->
  <line x1="100" y1="480" x2="1100" y2="480" stroke="rgba(242, 242, 238, 0.12)" stroke-width="1"/>
  <text x="100" y="525" font-family="monospace" font-size="20" fill="#797972">aarizshadman.dev</text>
  <text x="1100" y="525" font-family="monospace" font-size="20" fill="#797972" text-anchor="end">Bengaluru, India • CS Undergrad</text>
</svg>
